name: AV19 compatibility
on:
  push:
    branches: [fix/av19-compatibility]
  pull_request:
    paths:
      - 'custom_components/reachy_mini/**'
      - 'wheels/**'
      - 'scripts/build_av19_wheel.py'
      - 'scripts/check_av19_media.py'
      - '.github/workflows/av19-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/build_av19_wheel.py
      - run: cmp dist/aiortc-1.14.0+av19.1-py3-none-any.whl wheels/aiortc-1.14.0+av19.1-py3-none-any.whl
      - run: python -m pip install "av==19.0.0" dist/*.whl aiohttp
      - run: python -m pip check
      - run: python scripts/check_av19_media.py
  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "homeassistant==2026.10.1" "av==19.0.0" "PyTurboJPEG==1.8.3" wheels/aiortc-1.14.0+av19.1-py3-none-any.whl
      - run: python -m pip check
      - name: Import integration and platforms
        run: |
          python - <<'PY'
          import importlib
          for module in ("", ".config_flow", ".camera", ".sensor", ".binary_sensor", ".button", ".number", ".select"):
              importlib.import_module("custom_components.reachy_mini" + module)
          PY
      - run: python scripts/check_av19_media.py
