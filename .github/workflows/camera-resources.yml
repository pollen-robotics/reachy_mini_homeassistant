name: Camera resource regression
on:
  push:
    branches: [fix/camera-resource-management]
  pull_request:
    paths:
      - 'custom_components/reachy_mini/**'
      - 'scripts/check_camera_resources.py'
      - 'tests/**'
      - '.github/workflows/camera-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            av: '18.0.0'
          - python: '3.13'
            av: '19.0.0'
          - python: '3.14'
            av: '19.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "av==${{ matrix.av }}" "aiortc==1.16.0" aiohttp
      - run: python -m pip check
      - run: python -u scripts/check_camera_resources.py
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "homeassistant==2026.10.1" pytest-homeassistant-custom-component "av==19.0.0" "PyTurboJPEG==1.8.3" "aiortc==1.16.0"
      - run: python -m pip check
      - run: python -m pytest -q
