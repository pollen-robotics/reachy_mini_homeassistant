name: Camera resource regression
on:
  push:
    branches: [fix/camera-resource-management]
  pull_request:
    paths:
      - 'custom_components/reachy_mini/**'
      - 'scripts/check_camera_resources.py'
      - 'scripts/build_av19_wheel.py'
      - 'tests/**'
      - '.github/workflows/camera-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            av: '18.0.0'
          - python: '3.13'
            av: '19.0.0'
          - python: '3.14'
            av: '19.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current supported dependencies
        if: matrix.av == '18.0.0'
        run: python -m pip install "av==18.0.0" wheels/aiortc-1.14.0+av17-py3-none-any.whl aiohttp
      - name: Build AV19 test wheel
        if: matrix.av == '19.0.0'
        run: |
          python scripts/build_av19_wheel.py
          python -m pip install "av==19.0.0" dist/*.whl aiohttp
      - run: python -m pip check
      - run: python -u scripts/check_camera_resources.py
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_av19_wheel.py
      - run: python -m pip install "homeassistant==2026.10.1" pytest-homeassistant-custom-component "av==19.0.0" "PyTurboJPEG==1.8.3" dist/*.whl
      - run: python -m pip check
      - run: python -m pytest -q
